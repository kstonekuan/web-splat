<!doctype html>
<html>

<head>
    <meta charset="utf-8">
    <title>web-splat</title>
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/normalize.css@8/normalize.css">
    <style>
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: black;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            touch-action: none;
            /* Prevent default touch behaviors like scrolling and zooming */
            -webkit-touch-callout: none;
            /* Disable callout on iOS */
            -webkit-user-select: none;
            /* Disable selection on iOS */
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        #spinner {
            position: absolute;
            top: calc(50% - 48px);
            left: calc(50% - 48px);
            z-index: 1000;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #spinner p {
            opacity: 0.5;
            font-size: small;
        }

        .loader {
            width: 96px;
            height: 96px;
            display: inline-block;
            position: relative;
        }

        .loader::after,
        .loader::before {
            content: '';
            box-sizing: border-box;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 2px solid #FFF;
            position: absolute;
            left: 0;
            top: 0;
            animation: animloader 2s linear infinite;
        }

        .loader::after {
            animation-delay: 1s;
        }

        @keyframes animloader {
            0% {
                transform: scale(0);
                opacity: 1;
            }

            100% {
                transform: scale(1);
                opacity: 0;
            }
        }

        svg {
            width: 114px;
            height: 114px;
            margin: 1em;
        }

        .bg {
            fill: none;
            stroke-width: 10px;
            stroke: #1A2C34;
        }

        [class^="meter-"] {
            fill: none;
            stroke-width: 5px;
            stroke-linecap: round;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;

        }

        .meter-1 {
            stroke-dasharray: 360;
            stroke-dashoffset: 360;
            stroke: white;
            animation: progress-1 1s ease-out;
        }

        .alert {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            height: 100%;
        }

        canvas {
            touch-action: none;
            /* Prevent default touch behaviors */
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        .drop-zone {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            height: 250px;
            border: 2px dashed rgba(255, 255, 255, 0.4);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            z-index: 100;
        }

        .drop-zone:hover {
            border-color: rgba(255, 255, 255, 0.7);
            background: rgba(255, 255, 255, 0.05);
        }

        .drop-zone.dragover {
            border-color: #fff;
            background: rgba(255, 255, 255, 0.1);
            border-style: solid;
        }

        .drop-zone.hidden {
            display: none;
        }

        .drop-zone-content {
            text-align: center;
            pointer-events: none;
        }

        .drop-icon {
            font-size: 48px;
            margin: 0 0 16px 0;
        }

        .drop-title {
            font-size: 18px;
            margin: 0 0 8px 0;
            color: rgba(255, 255, 255, 0.9);
        }

        .drop-subtitle {
            font-size: 14px;
            margin: 0;
            color: rgba(255, 255, 255, 0.5);
        }

        .reset-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            color: white;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            z-index: 1000;
        }

        .reset-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.5);
        }
    </style>
    <div id="spinner" style="display: none;">
        <svg>
            <circle class="bg" cx="57" cy="57" r="52" />
            <circle class="meter-1" cx="57" cy="57" r="52" />
            <text id="loading-display" fill="white" x="50%" y="50%" text-anchor="middle"
                alignment-baseline="middle">10%</text>
        </svg>
    </div>
    <div id="drop-zone" class="drop-zone">
        <input type="file" id="file-input" accept=".ply,.npz" hidden>
        <div class="drop-zone-content">
            <p class="drop-icon">&#128193;</p>
            <p class="drop-title">Drag & drop a .ply file here</p>
            <p class="drop-subtitle">or click to browse</p>
        </div>
    </div>
    <button id="reset-btn" class="reset-btn" hidden>New File</button>
    <div id="no-webgpu" class="alert" style="display: none;">
        <h1>WebGPU not supported</h1>
        <p>Your browser does not support WebGPU.<br><a
                href="https://developer.mozilla.org/en-US/docs/Web/API/WebGPU_API#browser_compatibility">Please use a
                browser that supports WebGPU.</a></p>
    </div>
    <div id="loading-error" class="alert" style="display: none;">
        <h1>Failed to load file</h1>
        <p id="error-message"></p>
        <button id="retry-btn" class="reset-btn" style="position: static; margin-top: 20px;">Try Another File</button>
    </div>
</head>

<body>
    <script type="module">
        async function checkWebGPU() {
            if (!navigator.gpu) {
                return false;
            }
            try {
                let adapter = await navigator.gpu.requestAdapter();
                let device = await adapter.requestDevice();
                return true;
            } catch (e) {
                return false;
            }
        }

        if (!await checkWebGPU()) {
            document.getElementById("drop-zone").classList.add("hidden");
            document.getElementById("no-webgpu").style.display = "flex";
            throw Error("WebGPU not supported.");
        }

        import init, { run_wasm } from "./web_splats.js";
        const initPromise = init();

        const dropZone = document.getElementById("drop-zone");
        const fileInput = document.getElementById("file-input");
        const resetBtn = document.getElementById("reset-btn");
        const spinner = document.getElementById("spinner");
        const loadingDisplay = document.getElementById("loading-display");

        // Click to open file picker
        dropZone.addEventListener("click", () => fileInput.click());

        // Drag and drop handlers
        dropZone.addEventListener("dragover", (e) => {
            e.preventDefault();
            dropZone.classList.add("dragover");
        });

        dropZone.addEventListener("dragleave", () => {
            dropZone.classList.remove("dragover");
        });

        dropZone.addEventListener("drop", (e) => {
            e.preventDefault();
            dropZone.classList.remove("dragover");
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                loadFile(files[0]);
            }
        });

        // File input change handler
        fileInput.addEventListener("change", (e) => {
            if (e.target.files.length > 0) {
                loadFile(e.target.files[0]);
            }
        });

        // Reset button
        resetBtn.addEventListener("click", () => {
            window.location.reload();
        });

        async function loadFile(file) {
            dropZone.classList.add("hidden");
            spinner.style.display = "flex";
            loadingDisplay.textContent = "Loading...";

            try {
                const arrayBuffer = await file.arrayBuffer();
                const fileSize = arrayBuffer.byteLength;
                loadingDisplay.textContent = (fileSize / (1024 * 1024)).toFixed(1) + " MB";

                const data = new Uint8Array(arrayBuffer);

                await initPromise;
                run_wasm(data, null, file.name, null);

                spinner.style.display = "none";
                resetBtn.hidden = false;
            } catch (e) {
                spinner.style.display = "none";
                showError(file.name, e);
            }
        }

        function showError(fileName, error) {
            const errorPane = document.getElementById("loading-error");
            const errorMessage = document.getElementById("error-message");

            // Extract meaningful message from WASM panics
            let message = error.message || String(error);
            if (message.includes("unreachable")) {
                message = "Unsupported file format. This viewer expects PLY files from 3D Gaussian Splatting (e.g., from the original 3DGS implementation).";
            } else if (message.includes("failed to fill whole buffer")) {
                message = "Invalid or corrupted file. The file structure doesn't match the expected 3DGS PLY format.";
            }

            errorMessage.innerHTML = `
                <span style="opacity: 0.7;">${fileName}</span><br><br>
                ${message}
            `;
            errorPane.style.display = "flex";

            document.getElementById("retry-btn").addEventListener("click", () => {
                window.location.reload();
            });

            console.error("Load error:", error);
        }

        // Canvas resize handler
        window.addEventListener("resize", () => {
            const canvas = document.getElementById("window-canvas");
            if (canvas) {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
        }, true);

        // Disable context menu
        document.addEventListener("contextmenu", (e) => e.preventDefault());
    </script>
</body>

</html>
